# Обновление локального стенда владельца после мержа PR в develop-m.
#
# Отдельный файл, а не job в deploy.yml: deploy.yml — боевой деплой на сервер
# по SSH с гейтом «только из main» (docs/deploy.md). Здесь ничего не уходит на
# сервер: job работает на self-hosted раннере в клоне владельца
# (D:\Development\VideCoding\CRMDormitory) и пересобирает его стенд.
#
# Стенд трогается ТОЛЬКО если клон реально обновился: все шаги, начиная с
# гварда имени проекта, стоят под `steps.clone.outputs.updated == 'true'`.
# Клон обновляется строго fast-forward — незапушенная работа не затирается.
#
# ВАЖНО: в блоках `run:` — только ASCII. Раннер пишет временный .ps1 без BOM,
# а Windows PowerShell 5.1 читает такой файл как ANSI: кириллица и типографские
# символы ломают разбор до первого оператора. Названия шагов и комментарии
# YAML — по-русски, всё исполняемое — по-английски. Проверка:
#   Select-String -Path .github\workflows\stand.yml -Pattern '[^\x00-\x7F]'
# Не-ASCII допускается только в строках `#`, `name:` и `- name:`.

name: Обновить локальный стенд

on:
  # Мерж PR в develop-m — это push в неё. Ручной запуск нужен для первого
  # прогона, для повторной попытки после сбоя и для сборки стенда из ветки,
  # которой в develop-m ещё нет (input `branch`).
  push:
    branches: [develop-m]
  workflow_dispatch:
    inputs:
      # Пусто — стенд собирается из develop-m, ровно как при push. Имя ветки —
      # стенд собирается из той ветки, что уже открыта в клоне владельца: клон
      # не переключается, ничего не мержится, в дело идёт то, что владелец
      # видит в рабочей копии. Нужно, чтобы проверить ветку на стенде до
      # мержа — например когда ветка сводит две головы alembic, и собирать
      # develop-m в этом состоянии нельзя (`alembic upgrade head` падает).
      branch:
        description: 'Ветка, из которой собрать стенд (пусто = develop-m)'
        required: false
        default: ''
        type: string

# Блока pull_request здесь нет и быть не должно: self-hosted раннер исполняет
# код из репозитория на машине владельца, а PR может прийти из форка.
permissions:
  contents: read

# Отмена на середине пересборки оставила бы полуразобранный стек, поэтому
# прогоны не отменяют друг друга, а встают в очередь.
concurrency:
  group: crm-stand
  cancel-in-progress: false

jobs:
  stand:
    name: Обновить локальный стенд
    runs-on: [self-hosted, Windows, crm-ci]
    timeout-minutes: 60
    env:
      LOCAL_CLONE: 'D:\Development\VideCoding\CRMDormitory'
      LOCAL_BRANCH: develop-m
      # Из input `branch` (он есть только у ручного запуска); пусто — значит
      # цель сборки это LOCAL_BRANCH. Пустое значение здесь — норма, поэтому
      # подстановку «пусто -> develop-m» делают сами шаги, а не выражение.
      STAND_BRANCH: ${{ inputs.branch }}
      STAND_PROJECT: crm-dormitory
      # Стек мониторинга — отдельный compose-проект (свои тома и образы),
      # поэтому у него своё имя. Оно же записано в monitor/docker-compose.monitor.yml
      # (`name:`), а здесь нужно, чтобы шаги не собирали имя из переменных.
      STAND_MONITOR_PROJECT: crm-dormitory-monitor
      STAND_BACKUP_DIR: 'D:\stand-backups\CRMDormitory'
    steps:
      # actions/checkout здесь не нужен: job работает в клоне владельца, а не в
      # рабочем каталоге раннера `_work`.
      - name: 'Проверка: клон и ветка'
        run: |
          $clone = $env:LOCAL_CLONE
          $branch = $env:LOCAL_BRANCH
          $target = "$env:STAND_BRANCH".Trim()
          if (-not $target) { $target = $branch }
          if (-not (Test-Path (Join-Path $clone '.git'))) {
            Write-Host "::error::No git repository at $clone (check LOCAL_CLONE in stand.yml)"
            exit 1
          }
          $current = git -C $clone rev-parse --abbrev-ref HEAD
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::git could not read the current branch in $clone"
            exit 1
          }
          $current = "$current".Trim()
          if ($current -ne $target) {
            if ($target -ne $branch) {
              Write-Host "::error::Manual stand build asked for branch '$target' but the clone is on '$current'. Stand left untouched: switch the clone to $target and re-run the job, or clear the 'branch' input to update the stand from $branch."
            }
            else {
              Write-Host "::error::Clone is on branch '$current', expected '$branch'. Stand left untouched: switch the clone to $branch and re-run the job. To put the branch that is already checked out on the stand, run this workflow manually and fill its 'branch' input with that branch name."
            }
            exit 1
          }
          # Another branch is allowed only for a manual run: the input exists
          # only on workflow_dispatch, a push must always build the base branch.
          if ($target -ne $branch -and $env:GITHUB_EVENT_NAME -ne 'workflow_dispatch') {
            Write-Host "::error::Refusing to build the stand from '$target': only a manual run may build a branch other than $branch."
            exit 1
          }
          Write-Host "stand branch: $target"
          git -C $clone log -1 --oneline

      - name: 'Клон: fast-forward до origin/develop-m либо сборка открытой ветки'
        # Токен живёт только внутри этого шага: в `env:` шага, не в URL клона,
        # не в `url.insteadOf` и не в конфиге git. На машине раннера нет
        # SSH-идентичности, поэтому клон своего remote (git@github.com:...) не
        # использует: адрес и заголовок передаются одной команде fetch.
        id: clone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $clone = $env:LOCAL_CLONE
          $branch = $env:LOCAL_BRANCH
          $target = "$env:STAND_BRANCH".Trim()
          if (-not $target) { $target = $branch }

          # Ручная сборка другой ветки: fetch и merge не нужны, в дело идёт
          # ровно то дерево, что открыто в клоне. Неотслеживаемые файлы при
          # этом не мешают (.artifacts и прочий мусор), а вот правки в
          # отслеживаемых файлах означают полусохранённое дерево — их не берём.
          if ($target -ne $branch) {
            $dirty = "$(git -C $clone status --porcelain -uno)".Trim()
            if ($dirty) {
              Write-Host "::error::Clone has uncommitted changes in tracked files, so the stand would be built from a half-saved tree. Stand left untouched: commit or stash them and re-run the job."
              exit 1
            }
            $head = "$(git -C $clone rev-parse --short HEAD)".Trim()
            Write-Host "manual stand build: $target at $head (the clone stays on $target)"
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "updated=true`n")
            exit 0
          }

          if (-not $env:GH_TOKEN -or -not $env:GITHUB_REPOSITORY) {
            Write-Host "::error::HTTPS fetch failed: token or repo URL is wrong (GH_TOKEN or GITHUB_REPOSITORY is empty)"
            exit 1
          }
          $repoUrl = "https://github.com/$($env:GITHUB_REPOSITORY).git"
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$($env:GH_TOKEN)"))
          $refspec = "+refs/heads/$($branch):refs/remotes/origin/$branch"

          # Never let git ask for credentials interactively: on the owner's
          # machine that would hang the job behind a credential prompt.
          $env:GIT_TERMINAL_PROMPT = '0'

          # Only origin/develop-m is refreshed, tags are not fetched and
          # pruning is off on purpose: other refs in the owner's clone stay.
          git -C $clone -c credential.helper= -c "http.extraheader=AUTHORIZATION: basic $basic" fetch --no-tags $repoUrl $refspec
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::HTTPS fetch failed: token or repo URL is wrong"
            exit 1
          }

          # Local commits ahead of origin are the owner's unpushed work.
          # Applying origin over them is not allowed, so the stand stays as is
          # and the run ends with a warning instead of a red cross.
          $ahead = "$(git -C $clone rev-list --count "origin/$branch..HEAD")".Trim()
          if ([int]$ahead -gt 0) {
            Write-Host "::warning::Clone has $ahead local commit(s) ahead of origin/$branch. Stand left untouched: origin cannot be applied over your work. Push or drop them and the next run will update the stand."
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "updated=false`n")
            exit 0
          }

          $before = "$(git -C $clone rev-parse --short HEAD)".Trim()
          git -C $clone merge --ff-only "origin/$branch"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Cannot fast-forward the clone: uncommitted changes in files the merge touches. Stand left untouched. Check git status in the clone, commit or stash, then re-run the job."
            exit 1
          }
          $after = "$(git -C $clone rev-parse --short HEAD)".Trim()
          Write-Host "clone updated: $before -> $after ($branch)"
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "updated=true`n")

      # ---------------------------------------------------------------------
      # Шаги стенда. Все до «Итога» стоят под if: updated == 'true'.
      # ---------------------------------------------------------------------
      - name: 'Проверка: имя compose-проекта'
        # Имя проекта и порты живут в `.env` клона, а он не в git. Без
        # COMPOSE_PROJECT_NAME compose поднял бы ВТОРОЙ стек с пустой базой
        # вместо обновления существующего — поэтому имя сверяется до любых
        # действий со стеком. Порты печатаются и уходят в GITHUB_ENV, чтобы не
        # хардкодить их в файле workflow.
        if: steps.clone.outputs.updated == 'true'
        run: |
          $dir = $env:LOCAL_CLONE
          $json = docker compose -f "$dir\docker-compose.yml" --project-directory $dir config --format json
          if ($LASTEXITCODE -ne 0 -or -not $json) {
            Write-Host "::error::docker compose config failed: check docker-compose.yml and .env in $dir"
            exit 1
          }
          $cfg = ($json -join "`n") | ConvertFrom-Json

          $project = "$($cfg.name)".Trim()
          if ($project -ne $env:STAND_PROJECT) {
            Write-Host "::error::Compose project name is '$project', expected '$($env:STAND_PROJECT)'. COMPOSE_PROJECT_NAME is missing or wrong in $dir\.env: without it compose would start a SECOND stack with an empty database instead of updating the existing one. Set COMPOSE_PROJECT_NAME=$($env:STAND_PROJECT) in .env and re-run the job."
            exit 1
          }
          Write-Host "compose project: $project"

          $apiPort = @($cfg.services.api.ports | ForEach-Object { "$($_.published)".Trim() } | Where-Object { $_ }) | Select-Object -First 1
          $webPort = @($cfg.services.web.ports | ForEach-Object { "$($_.published)".Trim() } | Where-Object { $_ }) | Select-Object -First 1
          if (-not $apiPort -or -not $webPort) {
            Write-Host "::error::No published port for api or web in $dir\.env: API_PORT and FRONTEND_PORT must be set, the liveness checks need them."
            exit 1
          }
          Write-Host "published ports: api=$apiPort web=$webPort"
          [IO.File]::AppendAllText($env:GITHUB_ENV, "STAND_API_PORT=$apiPort`n")
          [IO.File]::AppendAllText($env:GITHUB_ENV, "STAND_WEB_PORT=$webPort`n")

      - name: 'Стенд: одна голова миграций alembic'
        # api на двух головах уходит в цикл перезапуска на `alembic upgrade
        # head` (app/backend/entrypoint.sh), и «успешное» обновление стенда
        # отдаёт 502 на /api/. Проверка стоит ДО бэкапа и пересборки: отказ
        # дешевле разобранного стека, а починка — одна команда, её печатает
        # сам скрипт. Тот же скрипт работает в деплое и в проверках PR.
        if: steps.clone.outputs.updated == 'true'
        run: |
          $dir = $env:LOCAL_CLONE
          $script = Join-Path $dir '_tools\alembic-heads.py'
          if (-not (Test-Path $script)) {
            # Клон обновляется fast-forward до develop-m, файл появится в нём
            # после слияния инструмента. До этого проверять нечего.
            Write-Host "::warning::No _tools\alembic-heads.py in ${dir}: alembic head check skipped."
            exit 0
          }
          python $script
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Two alembic heads in ${dir}: api would restart-loop on 'alembic upgrade head' and the stand would answer 502. Fix: python _tools/alembic-heads.py --merge, then commit the new revision to develop-m. The stand is left as is."
            exit 1
          }
          Write-Host "alembic: single head"

      - name: 'Стенд: бэкап БД перед обновлением'
        # Миграции стенда накатывает сам api при старте (app/backend/entrypoint.sh:
        # alembic upgrade head), отката миграций нет. Дамп снимается ДО
        # пересборки и лежит вне клона: в клоне он был бы мусором в git status.
        if: steps.clone.outputs.updated == 'true'
        run: |
          $dir = $env:LOCAL_CLONE
          $file = "$dir\docker-compose.yml"
          $container = "$(docker compose -f $file --project-directory $dir ps -aq db)".Trim()
          if (-not $container) {
            Write-Host "::warning::No db container for project '$($env:STAND_PROJECT)': first run on this stand, nothing to roll back. Skipping the backup."
            exit 0
          }

          $running = "$(docker inspect -f '{{.State.Running}}' $container)".Trim()
          if ($running -ne 'true') {
            Write-Host "db container exists but is not running: starting it so a dump can be taken"
            docker compose -f $file --project-directory $dir up -d --wait db
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Could not start db: no dump was taken, stand left as is."
              exit 1
            }
          }

          # The dump is written INSIDE the container and copied out with
          # docker cp: redirecting the stream through PowerShell would corrupt
          # the binary output.
          docker compose -f $file --project-directory $dir exec -T db sh -c 'pg_dump -U $POSTGRES_USER -d $POSTGRES_DB -Fc -f /tmp/crm_stand.dump'
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::pg_dump failed: no dump was taken, stand left as is."
            exit 1
          }

          New-Item -ItemType Directory -Force -Path $env:STAND_BACKUP_DIR | Out-Null
          $stamp = Get-Date -Format 'yyyyMMdd-HHmmss'
          $target = Join-Path $env:STAND_BACKUP_DIR "crm_$stamp.dump"
          docker cp "${container}:/tmp/crm_stand.dump" $target
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $target)) {
            Write-Host "::error::docker cp of the dump failed: stand left as is."
            exit 1
          }
          docker compose -f $file --project-directory $dir exec -T db rm -f /tmp/crm_stand.dump

          $size = [math]::Round((Get-Item $target).Length / 1KB, 1)
          Write-Host "backup: $target ($size KB)"

      - name: 'Стенд: пересборка и перезапуск'
        # -p не передаётся: имя проекта берётся из .env клона (его сверяет шаг
        # выше), поэтому контейнеры пересоздаются, а не плодится второй стек.
        # --wait ждёт healthcheck'и db, api, operator-api и operator-web; у web
        # и bot healthcheck'ов нет, поэтому их живость доказывает следующий шаг.
        if: steps.clone.outputs.updated == 'true'
        run: |
          $dir = $env:LOCAL_CLONE
          docker compose -f "$dir\docker-compose.yml" --project-directory $dir up -d --build --remove-orphans --wait --wait-timeout 300
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::docker compose up failed: the stand is in an unknown state, see docker compose ps in the clone."
            exit 1
          }
          Write-Host "stand rebuilt: $($env:STAND_PROJECT)"

      - name: 'Проверка: стенд отвечает'
        # Порты приходят из docker compose config --format json (то есть из
        # .env клона), в файле workflow они не хардкодятся.
        if: steps.clone.outputs.updated == 'true'
        run: |
          $apiUrl = "http://localhost:$($env:STAND_API_PORT)/api/health"
          $webUrl = "http://localhost:$($env:STAND_WEB_PORT)/"

          try {
            $api = Invoke-WebRequest -Uri $apiUrl -UseBasicParsing -TimeoutSec 20
          }
          catch {
            Write-Host "::error::$apiUrl did not respond: $($_.Exception.Message). See docker compose logs api in the clone."
            exit 1
          }
          if ($api.StatusCode -ne 200) {
            Write-Host "::error::$apiUrl returned $($api.StatusCode), expected 200. See docker compose logs api in the clone."
            exit 1
          }
          if ("$($api.Content)" -notmatch '"status"\s*:\s*"ok"') {
            Write-Host "::error::$apiUrl answered without status ok: $($api.Content). See docker compose logs api in the clone."
            exit 1
          }
          Write-Host "$apiUrl -> $($api.StatusCode) $($api.Content)"

          try {
            $web = Invoke-WebRequest -Uri $webUrl -UseBasicParsing -TimeoutSec 20
          }
          catch {
            Write-Host "::error::$webUrl did not respond: $($_.Exception.Message). See docker compose logs web in the clone."
            exit 1
          }
          if ($web.StatusCode -ne 200) {
            Write-Host "::error::$webUrl returned $($web.StatusCode), expected 200. See docker compose logs web in the clone."
            exit 1
          }
          Write-Host "$webUrl -> $($web.StatusCode)"

      - name: 'Мониторинг: окружение стенда'
        # Стек мониторинга - отдельный compose-проект со своими томами
        # (Grafana, Prometheus, Loki) и своими образами. Здесь готовится
        # monitor/.env: он не в git (.gitignore), поэтому первый прогон на
        # свежем клоне создаёт его из monitor/.env.example. Два значения
        # приходят из стенда, а не из шаблона: иначе Prometheus не нашёл бы
        # api, а promtail и Dozzle смотрели бы контейнеры чужого проекта и
        # показывали пустоту.
        if: steps.clone.outputs.updated == 'true'
        run: |
          $dir = $env:LOCAL_CLONE
          $monitor = Join-Path $dir 'monitor'
          $envFile = Join-Path $monitor '.env'
          $template = Join-Path $monitor '.env.example'

          if (-not (Test-Path $envFile)) {
            if (-not (Test-Path $template)) {
              Write-Host "::error::monitor\.env.example is missing in ${dir}: cannot prepare monitor/.env, monitoring is not started."
              exit 1
            }
            Copy-Item -LiteralPath $template -Destination $envFile
            Write-Host "monitor/.env created from monitor/.env.example"
          }

          # WriteAllLines without BOM: docker compose --env-file reads the first
          # line as-is and a BOM would glue itself to the first key name.
          $utf8 = New-Object System.Text.UTF8Encoding($false)

          function Set-EnvLine([string]$Path, [string]$Key, [string]$Value) {
            $lines = @()
            if (Test-Path $Path) { $lines = @([IO.File]::ReadAllLines($Path)) }
            $pattern = '^\s*' + [regex]::Escape($Key) + '='
            $found = $false
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match $pattern) {
                $lines[$i] = "$Key=$Value"
                $found = $true
              }
            }
            if (-not $found) { $lines += "$Key=$Value" }
            [IO.File]::WriteAllLines($Path, $lines, $utf8)
          }

          function Get-EnvLine([string]$Path, [string]$Key) {
            if (-not (Test-Path $Path)) { return '' }
            $pattern = '^\s*' + [regex]::Escape($Key) + '=(.*)$'
            foreach ($line in [IO.File]::ReadAllLines($Path)) {
              if ($line -match $pattern) { return $Matches[1].Trim() }
            }
            return ''
          }

          $project = $env:STAND_PROJECT
          Set-EnvLine $envFile 'MONITORED_PROJECT' $project
          Set-EnvLine $envFile 'APP_NETWORK' "${project}_default"
          Write-Host "monitor: MONITORED_PROJECT=$project APP_NETWORK=${project}_default"

          # Grafana with an empty admin password restart-loops, and api in the
          # main stack needs the same non-empty value only on the server.
          $admin = Get-EnvLine $envFile 'GRAFANA_ADMIN_PASSWORD'
          if (-not $admin) {
            Set-EnvLine $envFile 'GRAFANA_ADMIN_PASSWORD' 'monitor-stand-only-change-me'
            Write-Host "::warning::GRAFANA_ADMIN_PASSWORD was empty in monitor/.env: the placeholder from monitor/.env.example is set (user admin). Change it in monitor/.env if this stand is reachable from the network."
          }

          # MONITOR_HOST is required by the main compose file (`${MONITOR_HOST:?}`)
          # even locally, where the address in the browser comes from
          # docker-compose.local.yml. An empty .env made by hand or a template
          # with this key blank would otherwise fail the whole stack with a
          # compose message about a missing variable.
          $hostName = Get-EnvLine $envFile 'MONITOR_HOST'
          if (-not $hostName) {
            Set-EnvLine $envFile 'MONITOR_HOST' 'monitor.local'
            Write-Host "::warning::MONITOR_HOST was empty in monitor/.env: set to monitor.local for the local stand. On a server it must be the real domain, otherwise Caddy has nothing to serve."
          }

          # Ports are published by monitor/docker-compose.local.yml on
          # 127.0.0.1 only. A busy port is not waited out: it usually belongs
          # to another stack, and stopping that stack is not this job's
          # business. The exception is our own monitoring project: from the
          # second run on, its grafana and dozzle still publish these ports
          # from the previous run, and `compose up -d` recreates exactly those
          # containers. Treating them as a foreign program made every run after
          # the first one fail on a port it holds itself.
          foreach ($pair in @(@('MONITOR_GRAFANA_PORT', '8095'), @('MONITOR_LOGS_PORT', '8096'))) {
            $key = $pair[0]
            $fallback = $pair[1]
            $value = Get-EnvLine $envFile $key
            if (-not $value) {
              $value = $fallback
              Set-EnvLine $envFile $key $value
            }
            $number = 0
            if (-not [int]::TryParse($value, [ref]$number)) {
              Write-Host "::error::$key in monitor/.env is '$value', expected a port number (for example $fallback)."
              exit 1
            }
            $client = New-Object System.Net.Sockets.TcpClient
            $free = $true
            try {
              $client.Connect('127.0.0.1', $number)
              $free = $false
            }
            catch {
              $free = $true
            }
            finally {
              $client.Dispose()
            }
            if (-not $free) {
              # @() keeps the result an array: an empty docker ps gives $null,
              # and $null.Count throws on Windows PowerShell 5.1.
              $own = @(docker ps --filter "publish=$number" --filter "label=com.docker.compose.project=$env:STAND_MONITOR_PROJECT" --format '{{.Names}}')
              if ($own.Count -gt 0) {
                Write-Host "monitor port ${number}: held by our own stack $($own -join ', ') — compose will recreate it ($key)"
                continue
              }
              $holders = @(docker ps --filter "publish=$number" --format '{{.Names}}')
              $who = ' (not a docker container)'
              if ($holders.Count -gt 0) { $who = " ($($holders -join ', '))" }
              Write-Host "::error::Port 127.0.0.1:$number ($key in monitor/.env) is already taken by another program$who. Monitoring is not started: free the port or set another one in monitor/.env and re-run the job."
              exit 1
            }
            Write-Host "monitor port ${number}: free ($key)"
          }

          $grafanaPort = Get-EnvLine $envFile 'MONITOR_GRAFANA_PORT'
          $logsPort = Get-EnvLine $envFile 'MONITOR_LOGS_PORT'
          [IO.File]::AppendAllText($env:GITHUB_ENV, "STAND_MONITOR_GRAFANA_PORT=$grafanaPort`n")
          [IO.File]::AppendAllText($env:GITHUB_ENV, "STAND_MONITOR_LOGS_PORT=$logsPort`n")

      - name: 'Мониторинг: пересборка и перезапуск'
        # -p обязателен: имя проекта у мониторинга своё, и без -p compose взял
        # бы его из файла - а на машине может лежать второй такой же стенд.
        # --build пересобирает docker-stats-exporter и notifier: они собираются
        # из дерева, а не тянутся из registry, и без --build работал бы старый
        # код. --remove-orphans убирает сервисы, выпавшие из файла (например
        # после откатa логирования), но только внутри этого проекта.
        if: steps.clone.outputs.updated == 'true'
        run: |
          $dir = $env:LOCAL_CLONE
          $monitor = Join-Path $dir 'monitor'
          $file = Join-Path $monitor 'docker-compose.monitor.yml'
          $local = Join-Path $monitor 'docker-compose.local.yml'
          $envFile = Join-Path $monitor '.env'
          docker compose -p $env:STAND_MONITOR_PROJECT -f $file -f $local --env-file $envFile up -d --build --remove-orphans
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::docker compose up for the monitoring stack failed. The main stand is up and untouched; see docker compose ps -a for project $($env:STAND_MONITOR_PROJECT)."
            exit 1
          }
          Write-Host "monitoring rebuilt: $($env:STAND_MONITOR_PROJECT)"

      - name: 'Проверка: мониторинг отвечает'
        # У Grafana и Dozzle нет healthcheck'ов в compose, поэтому проверяем
        # снаружи и по тем же адресам, что человек откроет в браузере.
        if: steps.clone.outputs.updated == 'true'
        run: |
          $dir = $env:LOCAL_CLONE
          $monitor = Join-Path $dir 'monitor'
          $file = Join-Path $monitor 'docker-compose.monitor.yml'
          $local = Join-Path $monitor 'docker-compose.local.yml'
          $envFile = Join-Path $monitor '.env'

          $grafanaUrl = "http://127.0.0.1:$($env:STAND_MONITOR_GRAFANA_PORT)/api/health"
          $grafanaOk = $false
          # Пять минут, а не две: на первом запуске Grafana прогоняет миграции
          # своей базы внутри тома grafana-data, и на холодной машине это
          # занимает около трёх минут. Пустой ответ здесь означал бы просто
          # «ещё не поднялась», а не поломку.
          for ($i = 1; $i -le 60; $i++) {
            try {
              $response = Invoke-WebRequest -Uri $grafanaUrl -UseBasicParsing -TimeoutSec 10
              if ($response.StatusCode -eq 200) {
                $grafanaOk = $true
                break
              }
            }
            catch {
            }
            if ($i % 12 -eq 0) {
              Write-Host "waiting for Grafana ($($i * 5) seconds): the first start runs database migrations"
            }
            Start-Sleep -Seconds 5
          }
          if (-not $grafanaOk) {
            docker compose -p $env:STAND_MONITOR_PROJECT -f $file -f $local --env-file $envFile logs --tail=30 grafana
            Write-Host "::error::Grafana did not answer 200 on $grafanaUrl within 300 seconds. The main stand is up and untouched. Check monitor/.env in the clone (port and GRAFANA_ADMIN_PASSWORD) and the log above."
            exit 1
          }
          Write-Host "$grafanaUrl -> 200"

          $logsUrl = "http://127.0.0.1:$($env:STAND_MONITOR_LOGS_PORT)/"
          $logsOk = $false
          for ($i = 1; $i -le 15; $i++) {
            try {
              $response = Invoke-WebRequest -Uri $logsUrl -UseBasicParsing -TimeoutSec 10
              if ($response.StatusCode -eq 200) {
                $logsOk = $true
                break
              }
            }
            catch {
            }
            Start-Sleep -Seconds 2
          }
          if (-not $logsOk) {
            docker compose -p $env:STAND_MONITOR_PROJECT -f $file -f $local --env-file $envFile logs --tail=30 dozzle
            Write-Host "::error::Dozzle did not answer 200 on $logsUrl within 30 seconds. Check MONITOR_LOGS_PORT in monitor/.env and the log above."
            exit 1
          }
          Write-Host "$logsUrl -> 200"

          # Loki наружу не публикуется, поэтому его живость спрашиваем изнутри
          # сети - через notifier, который в ней стоит.
          $probe = "import urllib.request;print(urllib.request.urlopen('http://loki:3100/ready', timeout=5).read().decode().strip())"
          $ready = ''
          for ($i = 1; $i -le 15; $i++) {
            $ready = "$(docker compose -p $env:STAND_MONITOR_PROJECT -f $file -f $local --env-file $envFile exec -T notifier python -c $probe 2>&1)".Trim()
            if ($ready -match 'ready') { break }
            Start-Sleep -Seconds 2
          }
          if ("$ready" -notmatch 'ready') {
            Write-Host "::error::Loki did not report ready through the notifier container: $ready"
            exit 1
          }
          Write-Host "loki: $ready"

          # Шов 'контейнер -> promtail -> Loki'. Метка service появляется только
          # тогда, когда promtail действительно читает контейнеры своего
          # проекта: пустой ответ означает неверный MONITORED_PROJECT.
          $valuesProbe = "import urllib.request;print(urllib.request.urlopen('http://loki:3100/loki/api/v1/label/service/values', timeout=5).read().decode().strip())"
          $services = ''
          for ($i = 1; $i -le 10; $i++) {
            $services = "$(docker compose -p $env:STAND_MONITOR_PROJECT -f $file -f $local --env-file $envFile exec -T notifier python -c $valuesProbe 2>&1)".Trim()
            if ($services -match '"api"') { break }
            Start-Sleep -Seconds 3
          }
          if ("$services" -notmatch '"api"') {
            Write-Host "::warning::Loki has no logs with service=api yet: $services. Logs of the stand appeared a moment ago, so this may fill in by itself; if it stays empty, MONITORED_PROJECT in monitor/.env is not $($env:STAND_PROJECT)."
          }
          else {
            Write-Host "loki services: $services"
          }

      - name: 'Итог: что теперь на стенде'
        if: always()
        run: |
          $dir = $env:LOCAL_CLONE
          $branch = $env:LOCAL_BRANCH
          $target = "$env:STAND_BRANCH".Trim()
          if (-not $target) { $target = $branch }
          $current = "$(git -C $dir rev-parse --abbrev-ref HEAD)".Trim()
          Write-Host "stand branch: $target, clone branch: $current"
          if ($target -ne $branch) {
            Write-Host "::warning::Stand was built from '$target', not from $branch. It stays that way until the next run that builds $branch, and migrations of '$target' are already applied to the stand database."
          }
          git -C $dir log -1 --oneline
          docker compose -f "$dir\docker-compose.yml" --project-directory $dir ps
          docker compose -f "$dir\docker-compose.yml" --project-directory $dir images

          # Monitoring stands next to the main stack and is listed separately:
          # its containers belong to another compose project.
          $monitorFile = Join-Path $dir 'monitor\docker-compose.monitor.yml'
          $monitorLocal = Join-Path $dir 'monitor\docker-compose.local.yml'
          $monitorEnv = Join-Path $dir 'monitor\.env'
          if ((Test-Path $monitorFile) -and (Test-Path $monitorEnv)) {
            Write-Host "monitoring project: $($env:STAND_MONITOR_PROJECT)"
            docker compose -p $env:STAND_MONITOR_PROJECT -f $monitorFile -f $monitorLocal --env-file $monitorEnv ps
          }
          else {
            Write-Host "monitoring: monitor/.env is absent, the stack was not started by this run"
          }
