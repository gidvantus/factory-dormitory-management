# Стенд CRM Dormitory: db + api + web + bot.
#
# Исходники лежат в app/: app/backend — FastAPI, app/frontend — React + nginx.
#
# Стенд этой рабочей копии (клон человека) — имя проекта `crm-dormitory`,
# рабочая ветка `develop-m`. У отдела разработки свой стенд по этому же
# compose-файлу: имя проекта `crm-dormitory-agent`, рабочая копия
# D:\Agents\CRMDormitory, свой том базы.
#
# Имя проекта и порты у каждого стенда свои, они лежат в его `.env`
# (`COMPOSE_PROJECT_NAME`, `FRONTEND_PORT`, `API_PORT`): у человека 8088 и 8008,
# у отдела — 8093 и 8094. Поэтому `docker compose` запускается без `-p`:
# имя берётся из `.env` рабочей копии, а не из имени каталога.
#
#   docker compose up -d --build
#
# Значения по умолчанию лежат в .env.example (он подключён как env_file ниже),
# свои значения кладутся в .env — он подключается вторым и переопределяет пример.
#
# Секреты (JWT_SECRET, SMTP_PASSWORD, POSTGRES_PASSWORD) в репозитории не хранятся:
# `.env.example` держит только имена и заглушки, реальные значения человек кладёт
# в свой `.env`. Письмо активации читает SMTP_* из того же env_file — отдельных
# ключей сервису `api` не нужно.

x-env-files: &env-files
  - path: .env.example
    required: true
  - path: .env
    required: false

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: *env-files
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # api ждёт именно готовности базы: иначе alembic падает на старте.
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    build: ./app/backend
    restart: unless-stopped
    env_file: *env-files
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8001}:8000"
    volumes:
      # Локальное хранилище файлов (режим без S3, `app/backend/app/storage.py`).
      # Именно том, а не каталог образа: без него исходные файлы импорта
      # исчезали бы при каждой пересборке контейнера. При заданных ключах S3
      # том просто не используется — файлы уходят в бакет.
      - uploads:/app/uploads

  web:
    build: ./app/frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-8080}:80"

  # ---------- TLS-терминация: домен и сертификат Let's Encrypt -------------
  # Включается профилем `tls`, нужен только на сервере:
  #   docker compose --profile tls up -d --build
  # Локально профиль не поднимается: у Let's Encrypt есть лимиты, а DNS домена
  # указывает на сервер, а не на машину разработчика. Без профиля caddy нет,
  # и локальные стенды работают как раньше.
  # Домен и правила — ./caddy/Caddyfile, эксплуатация — docs/ssl.md.
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    depends_on:
      - web
    environment:
      # Домен приходит только из .env: в конфиге его нет.
      # Пусто — Caddyfile не соберётся, и caddy не стартует (защита от
      # случайного запуска ACME без домена).
      SITE_DOMAIN: ${SITE_DOMAIN:-}
      # Почта для писем об истечении сертификата (ACME принимает только ASCII).
      ACME_EMAIL: ${ACME_EMAIL:-}
      # ACME-директория: боевая по умолчанию, staging — для первой проверки.
      CADDY_ACME_CA: ${CADDY_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      # Монтируется КАТАЛОГ, а не отдельный файл: при замене файла bind-mount
      # одного файла продолжает указывать на старый inode, и правки Caddyfile
      # не применялись бы. С каталогом конфиг всегда актуальный.
      - ./caddy:/etc/caddy:ro
      # Сертификаты и аккаунт ACME — в томе, переживают пересборку контейнера.
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      # /healthz отдаёт сам Caddy (блок :80 в Caddyfile) — без редиректа.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Бот Telegram: тонкий воркер на том же образе, что и `api`, но со своей
  # командой запуска. Своего Dockerfile у него нет, портов тоже: наружу бот не
  # открыт — он сам ходит в Bot API и в CRM по внутренней сети compose.
  # Миграции применяет `api`, поэтому бот только ждёт его старта.
  bot:
    build: ./app/backend
    restart: unless-stopped
    env_file: *env-files
    depends_on:
      - api
    command: ["python", "-m", "app.bot"]

volumes:
  pgdata:
  # Файлы локального хранилища: переживают пересборку контейнера `api`.
  uploads:
  # Сертификаты и аккаунт ACME: том удалять нельзя (см. docs/ssl.md).
  caddy_data:
  caddy_config:
