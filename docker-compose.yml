# Стенд CRM Dormitory: db + api + web.
#
# Запускать только со своим именем проекта, иначе compose возьмёт имя из каталога
# и можно задеть контейнеры и том базы соседнего стенда:
#
#   docker compose -p crm-dormitory-agent up -d --build
#
# Значения по умолчанию лежат в .env.example (он подключён как env_file ниже),
# свои значения кладутся в .env — он подключается вторым и переопределяет пример.

x-env-files: &env-files
  - path: .env.example
    required: true
  - path: .env
    required: false

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: *env-files
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # api ждёт именно готовности базы: иначе alembic падает на старте.
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    build: ./backend
    restart: unless-stopped
    env_file: *env-files
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8001}:8000"

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  pgdata:
