# Стенд CRM Dormitory: db + api + web.
#
# Исходники лежат в app/: app/backend — FastAPI, app/frontend — React + nginx.
#
# Стенд этой рабочей копии (клон человека) — имя проекта `crm-dormitory`,
# рабочая ветка `develop-m`.
#
# У отдела разработки свой стенд по этому же compose-файлу, но под другим именем
# проекта — `crm-dormitory-agent` — и со своим томом базы. Поэтому `-p` обязателен:
# без него compose возьмёт имя из имени каталога и можно задеть контейнеры и том
# базы соседнего стенда.
#
#   docker compose -p crm-dormitory up -d --build      # стенд человека  (8088/8008)
#   docker compose -p crm-dormitory-agent up -d --build # стенд отдела  (D:\Agents\CRMDormitory)
#
# Значения по умолчанию лежат в .env.example (он подключён как env_file ниже),
# свои значения кладутся в .env — он подключается вторым и переопределяет пример.

x-env-files: &env-files
  - path: .env.example
    required: true
  - path: .env
    required: false

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: *env-files
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # api ждёт именно готовности базы: иначе alembic падает на старте.
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    build: ./app/backend
    restart: unless-stopped
    env_file: *env-files
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8001}:8000"

  web:
    build: ./app/frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  pgdata:
