server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/html application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Проверка живости контейнера (используется в HEALTHCHECK).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # CSS и SVG кэшируются надолго: имена файлов меняются вместе с содержимым.
    location ~* \.(?:css|svg|png|jpe?g|webp|gif|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    # Лендинг одностраничный: любой неизвестный путь отдаёт index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
