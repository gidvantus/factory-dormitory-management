server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: любой неизвестный путь отдаёт index.html, чтобы работал /cabinet.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Служебный вход метрик Prometheus живёт только внутри сети compose
    # (`api:8000/metrics`, #213) и наружу не публикуется. Отвечать на него
    # SPA-фолбэком нельзя: «метрики не утекли наружу» проверяют кодом ответа
    # (`curl -o /dev/null -w '%{http_code}' https://<домен>/metrics` → 404), а
    # неизвестный путь даёт `index.html` со статусом 200 — закрытый путь
    # становится неотличим от открытого для внешнего мониторинга. Точное
    # совпадение `=` выигрывает у префиксного `location /` независимо от порядка.
    location = /metrics {
        return 404;
    }

    # Выкатка меняет хеши в именах файлов сборки, а `index.html` остаётся тем же
    # адресом. Без явного `Cache-Control` браузер держит его в эвристическом
    # кеше и после пересборки показывает старую страницу со старым JS — так
    # удалённый блок «всё ещё выводился» на стенде (#177). Пусть спрашивает.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Имя файла сборки меняется вместе с содержимым: старую копию можно держать
    # в кеше сколько угодно, новая придёт под своим именем.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API проксируется с того же origin — иначе cookie сессии станет third-party.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # X-Real-IP не выставляем намеренно. API (app/main.py) читает X-Real-IP
        # раньше X-Forwarded-For, поэтому после появления caddy $remote_addr —
        # это адрес контейнера caddy, а не клиента: журнал аудита писал бы
        # 172.x.x.x вместо настоящего адреса. Без этой строки бэкенд берёт первый
        # элемент X-Forwarded-For, куда caddy уже положил клиента, а на локальном
        # стенде без caddy первым элементом остаётся $remote_addr — тоже верно.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Импорт «Мест» шлёт .xlsx целиком: с дефолтным лимитом 1 МБ nginx
        # отсекал бы файл и отдавал 413 без объяснения. У API тот же предел.
        client_max_body_size 20m;
    }
}
