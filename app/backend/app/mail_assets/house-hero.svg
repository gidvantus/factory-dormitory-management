<svg xmlns="http://www.w3.org/2000/svg" width="224" height="224" viewBox="0 0 112 112" role="img" aria-label="Домик">
  <!-- Исходник домика для плашки-героя писем приглашения и активации.
       Контурный рисунок по макету: двускатная крыша, стена, дверь, одно окно
       с переплётом, солнце справа сверху и две штриховые линии травы.
       Палитра — существующие hex-значения продукта: контур #27313D, дверь
       #2F7D62, солнце #F2D793, стена #FFFFFF. Градиентов, теней, фильтров,
       встроенных шрифтов и растровых вставок нет; фон прозрачный.
       В письмо едет растр рядом (house-hero.png): SVG почтовики не рисуют. -->
  <circle cx="94" cy="18" r="8.5" fill="#F2D793"/>
  <path d="M22 50 L56 18 L90 50" fill="none" stroke="#27313D" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="30" y="50" width="52" height="48" fill="#FFFFFF" stroke="#27313D"
        stroke-width="3" stroke-linejoin="round"/>
  <rect x="40" y="78" width="14" height="20" fill="#2F7D62"/>
  <rect x="62" y="58" width="14" height="14" fill="#FFFFFF" stroke="#27313D"
        stroke-width="2.5"/>
  <path d="M69 57.5 V72.5 M61.5 65 H76.5" fill="none" stroke="#27313D"
        stroke-width="2.5" stroke-linecap="round"/>
  <path d="M34 104 h5 m4 0 h5 M62 104 h5 m4 0 h5" fill="none" stroke="#27313D"
        stroke-width="2.5" stroke-linecap="round"/>
</svg>
