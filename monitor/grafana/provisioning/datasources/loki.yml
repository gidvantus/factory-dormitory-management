# Grafana — автоподключение Loki как источника данных для логов.
#
# uid задан явно: на него ссылаются панели дашборда «Логи и ошибки»
# (`"uid": "loki"`), поэтому переименование источника не должно оставлять
# панели с пустым результатом.
#
# isDefault: false — по умолчанию остаётся Prometheus: Explore открывается на
# метриках, а логи в нём выбирают источником вручную. Второй источник по
# умолчанию в Grafana невозможен, и это правильно: логовые запросы и
# PromQL несовместимы, случайная подстановка дала бы пустой экран.
apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      # Потолок строк на один запрос: без него «покажи все логи за сутки»
      # из браузера кладёт и Grafana, и Loki.
      maxLines: 1000
