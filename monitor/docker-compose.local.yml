# Оверрайд ТОЛЬКО для стенда отдела: открыть Grafana и логи браузером.
#
#   docker compose -p crm-dormitory-monitor-local \
#       -f monitor/docker-compose.monitor.yml \
#       -f monitor/docker-compose.local.yml \
#       --env-file monitor/.env up -d --build
#
# Зачем отдельный файл, а не `ports:` в основном. Критерий #213/4 — стек
# мониторинга не публикует наружу ни одного порта; на сервере вход один,
# https://monitor.<домен> через Caddy. Локально Caddy с сертификатом нет, и без
# порта в интерфейс не попасть вообще. Поэтому публикация живёт в файле,
# который на сервере не применяется: деплой знает только основной файл
# (.github/workflows/deploy-monitoring.yml), и «локальные» порты не могут
# уехать на бой по забывчивости.
#
# 127.0.0.1, а не 0.0.0.0. На этих портах нет пароля от Caddy — вход только
# пароль Grafana (8095) и вообще без входа (8096, Dozzle). Публиковать их в
# локальную сеть значит отдать коллегам, гостевому Wi-Fi и любому процессу на
# машине логи всех контейнеров, включая токены в запросах. `docker compose ps`
# должен показывать у них ровно `127.0.0.1:8095->3000/tcp`.

services:
  grafana:
    ports:
      - "127.0.0.1:${MONITOR_GRAFANA_PORT:-8095}:3000"
    environment:
      # Адрес в браузере локально другой. Без этих строк Grafana 11 получает
      # запрос с Origin http://localhost:8095, сравнивает его со своим
      # root_url (боевой https://monitor.<домен>/) и отвечает «origin not
      # allowed»: контейнер здоров, а вход в интерфейс невозможен.
      GF_SERVER_ROOT_URL: http://localhost:${MONITOR_GRAFANA_PORT:-8095}/
      GF_SERVER_DOMAIN: localhost
      GF_SECURITY_CSRF_TRUSTED_ORIGINS: localhost:${MONITOR_GRAFANA_PORT:-8095}
      GF_LIVE_ALLOWED_ORIGINS: localhost:${MONITOR_GRAFANA_PORT:-8095}
      # По http:// secure-cookie браузер не отдаёт: вход выглядел бы как
      # «ввёл пароль и остался на странице входа».
      GF_SECURITY_COOKIE_SECURE: "false"

  dozzle:
    ports:
      - "127.0.0.1:${MONITOR_LOGS_PORT:-8096}:8080"

  # Loki и promtail портов не получают и локально: Loki смотрят через Grafana
  # (Explore → Loki), а promtail — это сборщик, у него нет интерфейса.
