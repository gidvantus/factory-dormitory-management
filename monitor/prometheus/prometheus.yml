# Prometheus — глобальная конфигурация CRM Dormitory.
#
# Цели скрейпа именами сервисов compose: мониторинг живёт в сети основного
# стека (monitor/docker-compose.monitor.yml), поэтому `api:8000` и
# `node-exporter:9100` резолвятся как обычно.
#
# Имена job'ов совпадают с теми, на которые опираются правила алертов
# (monitor/prometheus/alerts.yml) и вечерняя сводка (monitor/notifier/app.py):
# job="api" — приложение, job="node-exporter" — хост, job="docker-stats" —
# контейнеры. Переименование job'а тихо отключает половину алертов.
global:
  # 15 с — компромисс: ошибки видны через прошлый интервал, а не через минуту.
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Метрики хоста: CPU, память, диск сервера.
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # Метрики приложения: http_requests_total, http_request_duration_seconds,
  # db_size_bytes (app/backend/app/metrics.py). Порт 8000 — внутренний адрес
  # api в compose; на хост он не публикуется.
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Метрики контейнеров: CPU, память, сеть, container_last_seen.
  - job_name: docker-stats
    metrics_path: /metrics
    static_configs:
      - targets: ["docker-stats-exporter:9102"]
