# =====================================================================
# Мониторинг боевого CRM Dormitory: метрики приложения, ресурсы сервера и
# контейнеров, алерты в Telegram и вечерняя сводка за сутки.
#
#   docker compose -f monitor/docker-compose.monitor.yml \
#       --env-file monitor/.env up -d --build
#
# Запускать ТОЛЬКО так, с явным `--env-file monitor/.env`: у этого стека своё
# окружение, и без флага compose подхватил бы корневой `.env` основного
# приложения (пароли базы, JWT_SECRET) — мониторингу они не нужны.
# Эксплуатация и первый запуск — docs/monitoring.md, деплой —
# .github/workflows/deploy-monitoring.yml.
#
# НАРУЖУ НЕ ПУБЛИКУЕТСЯ НИ ОДИН ПОРТ. У сервисов ниже нет `ports:` вовсе:
#
#   * Grafana открывается по https://monitor.<SITE_DOMAIN> через Caddy
#     основного стека (блок `monitor.` в caddy/Caddyfile): Caddy терминирует
#     TLS и требует логин/пароль (basic auth), прежде чем пустить в Grafana;
#   * Prometheus, Alertmanager, notifier, node-exporter и docker-stats-exporter
#     видны только внутри сети основного стека.
#
# Сеть берётся у основного стека, а не своя: Prometheus ходит на `api:8000`
# за /metrics, а Caddy — на `grafana:3000`. Своей сети у мониторинга нет
# намеренно: `api` не публикует 8000 на хост (API_PORT на сервере —
# 127.0.0.1:…), и попасть в него можно только изнутри.
#
# Логи контейнеров тоже здесь: promtail забирает stdout контейнеров (их находит
# сам через docker API, список руками не пишется) и складывает в Loki, а Dozzle
# показывает тот же поток живьём — без индексации и поиска по истории. Два
# инструмента, потому что вопросы разные: «что происходит прямо сейчас» и «что
# было вчера в 3:40». Оба открываются на https://logs.<SITE_DOMAIN> через
# Caddy (блок `logs.`), там же basic auth; Loki доступен ещё и как источник
# данных Grafana.
#
# ЧЬИ КОНТЕЙНЕРЫ. Только одного compose-проекта — MONITORED_PROJECT (по
# умолчанию crm-dormitory). Docker API отдаёт все контейнеры машины, и без
# фильтра в мониторинг попадали бы чужие стеки: их логи в Loki, их контейнеры в
# Dozzle, их CPU в алертах. Фильтр стоит на трёх сборщиках сразу (promtail,
# dozzle, docker-stats-exporter), поэтому метрики, логи и алерты говорят про
# один и тот же набор контейнеров. Стенду отдела нужно своё имя проекта:
# `MONITORED_PROJECT=crm-dormitory-agent` в monitor/.env.
#
# Секреты — только из monitor/.env (в git его нет, см. .gitignore и
# monitor/.env.example).
# =====================================================================

name: crm-dormitory-monitor

services:
  # ---------- Сбор метрик и алерт-правила ----------
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Хранение ограничено ДВУМЯ пределами сразу: диск сервера общий с боевой
      # базой, а графики старше двух недель в разборе инцидентов уже не
      # участвуют. Одного времени мало: при всплеске числа серий (новая метка,
      # новый контейнер) гигабайт-в-сутки съедается раньше двух недель, и
      # Prometheus упёрся бы в диск боевой базы. Размер важнее истории.
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-1GB}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

  # ---------- Дашборды ----------
  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Пароль обязателен: без него Grafana ушла бы в рестарт по кругу.
      # На бою значение генерирует деплой мониторинга и кладёт в monitor/.env.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD не задан — см. monitor/.env.example}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Анонимный доступ выключен явно: мониторинг открыт наружу пусть и по
      # basic auth, но второй слой (учётная запись Grafana) снимать нельзя —
      # один пароль на всё дешевле, чем «почти открытая» Grafana.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Grafana живёт за Caddy по домену: root_url, domain и списки Origin
      # обязаны совпадать с внешним адресом, иначе браузер получает
      # «origin not allowed», а вход — пустые дашборды.
      GF_SERVER_ROOT_URL: https://${MONITOR_HOST:?MONITOR_HOST не задан — см. monitor/.env.example}/
      GF_SERVER_DOMAIN: ${MONITOR_HOST:?MONITOR_HOST не задан — см. monitor/.env.example}
      # CSRF-проверки Grafana 11 и Grafana Live (WebSocket) проверяют Origin
      # отдельными списками.
      GF_SECURITY_CSRF_TRUSTED_ORIGINS: ${MONITOR_HOST:?MONITOR_HOST не задан — см. monitor/.env.example}
      GF_LIVE_ALLOWED_ORIGINS: ${MONITOR_HOST:?MONITOR_HOST не задан — см. monitor/.env.example}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # ---------- Маршрутизация алертов ----------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager

  # ---------- Alertmanager → Telegram и вечерняя сводка ----------
  # Свой мини-сервис, а не сторонний образ: он же собирает сводку за сутки из
  # Prometheus (monitor/notifier/app.py, docs/monitoring.md).
  notifier:
    build: ./notifier
    restart: unless-stopped
    environment:
      # Пустой токен — рабочее состояние: сообщения уходят в лог, процесс живёт.
      MONITOR_TELEGRAM_BOT_TOKEN: ${MONITOR_TELEGRAM_BOT_TOKEN:-}
      MONITOR_TELEGRAM_CHAT_ID: ${MONITOR_TELEGRAM_CHAT_ID:-}
      # Прокси только для Bot API: серверу без прямого выхода в Telegram. Пустое
      # значение — прямое соединение, оно же умолчание. Через прокси не идут
      # запросы к Prometheus (issue #232, docs/monitoring.md).
      MONITOR_TELEGRAM_PROXY_URL: ${MONITOR_TELEGRAM_PROXY_URL:-}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      DIGEST_HOUR: ${DIGEST_HOUR:-18}
      DIGEST_TIMEZONE: ${DIGEST_TIMEZONE:-Europe/Moscow}
      TZ: ${TZ:-Europe/Moscow}
    depends_on:
      - prometheus
    healthcheck:
      # curl в slim-образе нет: проверяем тем же Python, которым запущен сервис.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9087/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------- Метрики хоста: CPU/RAM/диск ----------
  node-exporter:
    image: prom/node-exporter:v1.7.0
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs

  # ---------- Метрики контейнеров через docker API ----------
  # Работает на любом docker (в отличие от cAdvisor, которому нужен доступ к
  # слоям хранилища): данные берутся из демона (`docker stats`) вместе с
  # именами и compose-метками контейнеров. Код перенесён из проекта Vahta без
  # изменения логики.
  docker-stats-exporter:
    build: ./docker-stats-exporter
    restart: unless-stopped
    environment:
      # Пустое значение — «все контейнеры хоста»; на сервере оно не пустое.
      # Без фильтра чужие контейнеры попадали бы в алерты ContainerStopped и
      # HighCpu: на общей машине это ложные срабатывания не про наш продукт.
      MONITORED_PROJECT: ${MONITORED_PROJECT:-crm-dormitory}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # ---------- История логов: приём и хранение ----------
  # Loki, а не ELK: тот же Prometheus-подход к меткам, один бинарник, память
  # в разы меньше. Хранение ограничено по времени (limits_config
  # .retention_period, 14 суток) и чистится компактором: диск сервера общий с
  # боевой базой, и локи без потолка съели бы его первыми.
  loki:
    image: grafana/loki:2.9.8
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    healthcheck:
      # /ready отвечает 200 и словом ready, когда хранилище готово принимать
      # записи. Без этого healthcheck'а promtail стартовал бы в пустоту и
      # первые минуты после `up --wait` терял бы логи.
      test:
        - CMD-SHELL
        - wget -q -O- http://127.0.0.1:3100/ready | grep -q ready
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------- Сбор логов контейнеров ----------
  # Контейнеры находит сам через docker API (docker_sd_configs), поэтому новый
  # сервис в основном стеке начинает логироваться без правки этого файла.
  # Читает json-file логи с хоста: другой logging driver в compose не задан, и
  # подробнее об этом — в monitor/promtail/promtail.yml.
  promtail:
    image: grafana/promtail:2.9.8
    restart: unless-stopped
    environment:
      # Подставляется в promtail.yml: собираем логи только этого проекта.
      # `-config.expand-env=true` в command обязателен — без него promtail
      # прочитает ${MONITORED_PROJECT} буквально и не найдёт ни одного
      # контейнера (тихая пустота вместо ошибки).
      MONITORED_PROJECT: ${MONITORED_PROJECT:-crm-dormitory}
      # TZ нужен, чтобы время в /metrics promtail совпадало с остальным стеком.
      TZ: ${TZ:-Europe/Moscow}
    command:
      - -config.file=/etc/promtail/promtail.yml
      - -config.expand-env=true
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Прочитанные позиции: без тома после каждого рестарта promtail
      # перечитывал бы логи контейнеров с начала и слал бы дубли в Loki.
      - promtail-positions:/var/lib/promtail
    depends_on:
      loki:
        condition: service_healthy

  # ---------- Живой просмотр логов ----------
  # Dozzle читает docker API и показывает поток логов контейнеров проекта
  # MONITORED_PROJECT (DOZZLE_FILTER ниже) — не всей машины.
  # Своего входа у него нет намеренно: логин и пароль спрашивает Caddy на
  # https://logs.<домен> ДО того, как запрос дойдёт до Dozzle. Открывать порт
  # наружу нельзя вдвойне — за Dozzle виден docker-сокет целиком.
  dozzle:
    image: amir20/dozzle:v8.5.3
    restart: unless-stopped
    environment:
      # Аналитика выключена: мониторинг не должен стучаться наружу сам.
      DOZZLE_NO_ANALYTICS: "true"
      # Тот же проект, что у promtail и экспортёра: список контейнеров в
      # интерфейсе совпадает с тем, чьи логи есть в Loki.
      DOZZLE_FILTER: label=com.docker.compose.project=${MONITORED_PROJECT:-crm-dormitory}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  loki-data:
  promtail-positions:

# Сеть основного стека: мониторинг видит `api:8000`, а Caddy видит `grafana:3000`.
# Имя проекта основного стека задаёт его COMPOSE_PROJECT_NAME; на сервере это
# crm-dormitory, у стенда отдела — своё, поэтому имя вынесено в APP_NETWORK.
networks:
  default:
    name: ${APP_NETWORK:-crm-dormitory_default}
    external: true
