server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Проверка живости для healthcheck compose: тело ровно `ok`, без записей в лог.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # SPA: любой неизвестный путь отдаёт index.html, чтобы работали `/` и `/login`
    # после перезагрузки страницы.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API проксируется с того же origin — иначе cookie сессии станет third-party.
    #
    # Адрес берётся через переменную и `resolver`, а не статическим `proxy_pass`:
    # при пересоздании контейнера `operator-api` получает новый IP, а nginx с
    # записанным при старте адресом продолжал бы ходить на старый и отдавать 502.
    # Docker-DNS 127.0.0.11 резолвит имя заново каждые 10 секунд.
    resolver 127.0.0.11 valid=10s;
    location /api/ {
        set $operator_upstream operator-api;
        proxy_pass http://$operator_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # `client_max_body_size` не задаём: загрузок в кабинете нет.
    }
}
